name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features ravyn-web/ssr -- -D warnings
      - run: cargo clippy -p ravyn-web --lib --features hydrate --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace --features ravyn-web/ssr
