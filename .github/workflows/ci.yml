name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ravyn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features ravyn-web/ssr -- -D warnings
      - run: cargo clippy -p ravyn-web --lib --features hydrate --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace --features ravyn-web/ssr -- --include-ignored
        env:
          DATABASE_URL: postgres://postgres:ravyn@localhost:5432/postgres
