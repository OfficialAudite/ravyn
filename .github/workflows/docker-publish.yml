name: Publish Docker images

# Builds ravyn-api and ravyn-web and pushes both to GHCR: `latest` on every
# push to master, plus a version tag whenever a `v*` git tag is pushed, so
# a `docker-compose.yml` can pin to a specific release if it wants to.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: ravyn-api
            dockerfile: crates/ravyn-api/Dockerfile
          - image: ravyn-web
            dockerfile: crates/ravyn-web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # Hardcoded lowercase rather than derived from github.repository,
          # which preserves the repo's actual casing (OfficialAudite/ravyn)
          # and would produce an invalid, uppercase image reference.
          images: ghcr.io/officialaudite/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per image so ravyn-api and ravyn-web (different
          # Dockerfiles, different dependency sets) don't fight over the
          # same cache entries.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
